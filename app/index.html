<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dF – Feather and Differentiation PDF</title>
  <meta name="description" content="A lightweight PDF reader that opens huge PDFs on low-memory Chromebooks without freezing.">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <button id="toc-btn" class="icon-btn" type="button" data-i18n-title="contents" hidden>☰</button>
    <label class="open-btn">
      <span data-i18n="open">Open PDF</span>
      <input id="file" type="file" accept="application/pdf,.pdf" hidden>
    </label>
    <span id="name" class="name"></span>
    <div id="controls" class="controls" hidden>
      <button id="zoom-out" class="icon-btn" type="button" data-i18n-title="zoomOut">−</button>
      <button id="zoom-reset" class="zoom-label" type="button" data-i18n-title="zoomReset">100%</button>
      <button id="zoom-in" class="icon-btn" type="button" data-i18n-title="zoomIn">+</button>
      <form id="goto" class="goto">
        <input id="page" type="number" min="1" inputmode="numeric" data-i18n-title="page">
        <span>/ <span id="total">0</span></span>
      </form>
    </div>
    <span id="stats" class="stats" hidden></span>
  </header>
  <div class="body">
    <nav id="toc" class="toc" hidden>
      <ul id="toc-list"></ul>
      <p id="toc-empty" class="toc-empty" data-i18n="noOutline" hidden></p>
    </nav>
    <main id="viewer" class="viewer" tabindex="0">
      <div class="empty">
        <p data-i18n="emptyTitle"></p>
        <p class="hint" data-i18n="emptyHint"></p>
        <p class="hint" data-i18n="installHint"></p>
        <p id="version" class="version"></p>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="main.js"></script>
</body>
</html>
